version: '3.8'

services:
  api-pagamentos:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: api-pagamentos-local
    ports:
      - "8080:8080"
    environment:
      - RESERVA_BANCARIA_SALDO=100000.00
      - API_PORT=8080
      - LOG_LEVEL=INFO
      - PIX_KEY=unifiap-pix-555354-key-simulation
      - API_TOKEN=unifiap-token-555354
    volumes:
      - logs_volume:/var/logs/api
      - data_volume:/data
    networks:
      - unifiap_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    user: "1000:1000"

  auditoria-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.auditoria
    container_name: auditoria-service-local
    ports:
      - "8081:8081"
    environment:
      - AUDITORIA_PORT=8081
      - LOG_LEVEL=INFO
      - DB_PASSWORD=secure-password-555354
      - API_TOKEN=unifiap-token-555354
    volumes:
      - logs_volume:/var/logs/api
      - data_volume:/data
    networks:
      - unifiap_net
    depends_on:
      api-pagamentos:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    user: "1000:1000"

volumes:
  logs_volume:
    driver: local
  data_volume:
    driver: local

networks:
  unifiap_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/24
