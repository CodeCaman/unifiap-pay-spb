apiVersion: batch/v1
kind: CronJob
metadata:
  name: cronjob-fechamento-reserva
  namespace: unifiapay
spec:
  schedule: "0 */6 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 3
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            app: cronjob-fechamento
        spec:
          serviceAccountName: unifiapay-sa
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            fsGroup: 1000
          restartPolicy: OnFailure
          containers:
          - name: auditoria-job
            image: codecaman/auditoria-service:v1.555354
            imagePullPolicy: IfNotPresent
            command: ["/app/audit-job.sh"]
            env:
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: unifiapay-config
                  key: LOG_LEVEL
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: unifiapay-secrets
                  key: db-password
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: 500m
                memory: 512Mi
            volumeMounts:
            - name: logs
              mountPath: /var/logs/api
            - name: data
              mountPath: /data
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities:
                drop:
                - ALL
          volumes:
          - name: logs
            persistentVolumeClaim:
              claimName: unifiapay-logs-pvc
          - name: data
            persistentVolumeClaim:
              claimName: unifiapay-data-pvc
