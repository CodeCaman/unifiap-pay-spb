apiVersion: apps/v1
kind: Deployment
metadata:
  name: auditoria-service
  namespace: unifiapay
  labels:
    app: auditoria-service
    version: v1.555354
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auditoria-service
  template:
    metadata:
      labels:
        app: auditoria-service
        version: v1.555354
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
    spec:
      serviceAccountName: unifiapay-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: auditoria-service
        image: codecaman/auditoria-service:v1.555354
        imagePullPolicy: Never
        ports:
        - containerPort: 8081
          name: http
          protocol: TCP
        env:
        - name: AUDITORIA_PORT
          valueFrom:
            configMapKeyRef:
              name: unifiapay-config
              key: AUDITORIA_PORT
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: unifiapay-config
              key: LOG_LEVEL
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: unifiapay-secrets
              key: db-password
        - name: API_TOKEN
          valueFrom:
            secretKeyRef:
              name: unifiapay-secrets
              key: api-token
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 8081
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: logs
          mountPath: /var/logs/api
        - name: data
          mountPath: /data
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL
      volumes:
      - name: logs
        persistentVolumeClaim:
          claimName: unifiapay-logs-pvc
      - name: data
        persistentVolumeClaim:
          claimName: unifiapay-data-pvc
