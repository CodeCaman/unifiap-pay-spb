apiVersion: v1
kind: ServiceAccount
metadata:
  name: unifiapay-sa
  namespace: unifiapay
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: unifiapay-role
  namespace: unifiapay
rules:
- apiGroups: [""]
  resources: ["pods", "pods/log"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list"]
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get"]
- apiGroups: ["batch"]
  resources: ["jobs", "cronjobs"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: unifiapay-rolebinding
  namespace: unifiapay
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: unifiapay-role
subjects:
- kind: ServiceAccount
  name: unifiapay-sa
  namespace: unifiapay
