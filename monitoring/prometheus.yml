global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: 'unifiap-spb'
    system: 'payment-system'

rule_files:
  - "alert_rules.yml"

scrape_configs:
  # API de Pagamentos - Banco Originador
  - job_name: 'api-pagamentos'
    static_configs:
      - targets: ['api-pagamentos-simple-service.unifiapay.svc.cluster.local:5000']
    metrics_path: '/metrics'
    scrape_interval: 15s

  # Auditoria Service - Sistema de Liquidação
  - job_name: 'auditoria-service'
    static_configs:
      - targets: ['auditoria-simple-service.unifiapay.svc.cluster.local:5001']
    metrics_path: '/metrics'
    scrape_interval: 15s

  # Frontend PIX
  - job_name: 'frontend-pix'
    static_configs:
      - targets: ['frontend-pix-simple-service.unifiapay.svc.cluster.local:80']
    metrics_path: '/nginx_status'
    scrape_interval: 30s

  # Node Exporter - Métricas do Sistema
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter-service.unifiapay.svc.cluster.local:9100']
    scrape_interval: 30s

  # Prometheus Self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    scrape_interval: 30s

  # Kube State Metrics - Métricas do Kubernetes
  - job_name: 'kube-state-metrics'
    static_configs:
      - targets: ['kube-state-metrics.unifiapay.svc.cluster.local:8080']
    scrape_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: []